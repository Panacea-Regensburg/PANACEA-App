<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panacea – Reset Quotidiano</title>

<style>
:root{
  --bg1:#f6f1e6;
  --bg2:#efe7d7;
  --card:#ffffffd9;
  --card2:#ffffffee;
  --gold:#c8a24a;
  --gold2:#e8d28a;
  --text:#2b2b2b;
  --muted:#6b6b6b;
  --shadow:0 14px 40px rgba(0,0,0,.10);
  --shadow2:0 10px 26px rgba(0,0,0,.10);
  --radius:22px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:ui-sans-serif,system-ui;
  background:radial-gradient(1200px 800px at 30% 0%,var(--bg1),var(--bg2));
  display:flex;
  justify-content:center;
  padding:28px 14px;
  color:var(--text);
}

.phone{width:100%;max-width:480px}

/* ===== TOPBAR ===== */
.topbar{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:14px;
}

.back{
  text-decoration:none;
  padding:10px 14px;
  border-radius:999px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid rgba(200,162,74,.20);
  box-shadow:var(--shadow2);
  color:var(--text);
}

.rightTop{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  min-width:210px;
  padding-top:52px;
}

/* === LANGUAGE CENTERED === */
.langToggle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:0;
  display:flex;
  gap:10px;
  z-index:10;
}

.langBtn{
  border:none;
  cursor:pointer;
  padding:10px 14px;
  border-radius:999px;
  font-weight:900;
  background:rgba(255,255,255,.7);
  border:1px solid rgba(200,162,74,.18);
}

.langBtn.active{
  background:radial-gradient(circle at 20% 10%,#fff6d6,#e8d28a);
  border:1px solid rgba(200,162,74,.35);
  color:#3a2c10;
}

.brand{text-align:right;line-height:1.1}
.brand .t1{font-size:14px;color:var(--muted)}
.brand .t2{font-size:18px;font-weight:800}
.brand .glow{color:var(--gold);font-weight:900}

/* ===== CARD ===== */
.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border-radius:var(--radius);
  border:1px solid rgba(200,162,74,.18);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.hero{display:flex;gap:14px;padding:18px}
.badge{
  width:64px;height:64px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;background:radial-gradient(circle,#fff6d6,#e8d28a);
}
.hero h1{margin:0;font-size:18px}
.hero p{margin:6px 0 0;font-size:13px;color:var(--muted)}

.content{padding:16px 18px 18px}

.resetOut{
  padding:12px;border-radius:16px;
  background:rgba(255,255,255,.70);
  border:1px solid rgba(200,162,74,.16);
}

.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,162,74,.35),transparent);
  margin:16px 0;
}

.phase{text-transform:uppercase;font-weight:900;font-size:12px;text-align:center}
.timerRow{text-align:center;font-weight:800;margin-top:6px}
.time{
  padding:8px 12px;border-radius:999px;
  background:white;border:1px solid rgba(200,162,74,.16)
}

.controls{
  display:flex;gap:10px;margin-top:14px
}
button{
  flex:1;padding:12px;border-radius:14px;
  font-weight:900;border:1px solid rgba(200,162,74,.20);
  background:linear-gradient(180deg,#fff,#f7f2e6);
}
button.primary{
  background:radial-gradient(circle,#fff6d6,#e8d28a);
}

/* ===== Responsive ===== */
@media(max-width:420px){
  .controls button{min-width:100%}
}
</style>
</head>

<body>
<div class="phone">

<div class="topbar">
  <a class="back" href="indexIT.html">← Home</a>

  <div class="langToggle">
    <button class="langBtn" id="btnDE">Deutsch</button>
    <button class="langBtn active" id="btnIT">Italiano</button>
  </div>

  <div class="rightTop">
    <div class="brand">
      <div class="t1">Panacea</div>
      <div class="t2"><span class="glow">Reset</span> Quotidiano</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="hero">
    <div class="badge">DR</div>
    <div>
      <h1>Reset Quotidiano</h1>
      <p>3–5 minuti per la tua stabilità interiore: respira con calma e ritrova chiarezza.</p>
    </div>
  </div>

  <div class="content">

    <div class="resetOut">
      <strong>Oggi</strong><br>
      Porta l’attenzione sul prossimo passo chiaro.
    </div>

    <div class="divider"></div>

    <div class="phase">Pronto</div>
    <div class="timerRow">
      Tempo restante <span class="time">03:00</span>
    </div>

    <div class="controls">
      <button class="primary">Start</button>
      <button>Pausa</button>
      <button>Reset</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
