<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#113a2d" />
  <title>Wissen & Klarheit – Panacea</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#0f1e17;
      --muted:rgba(15,30,23,.72);
      --glass:rgba(255,255,255,.70);
      --shadow:0 24px 60px rgba(0,0,0,.22);
      --radius:22px;
      --accent:#113a2d;
      --line:rgba(231,200,115,.45);
      --goldGlow: 0 0 18px rgba(231,200,115,.28), 0 18px 50px rgba(0,0,0,.16);
    }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:url("icons/sfondo.png") center / cover no-repeat fixed;
    }
    .veil{
      min-height:100%;
      background: radial-gradient(circle at 30% 5%, rgba(255,255,255,.55), rgba(255,255,255,.0) 60%);
      padding:22px 14px 60px;
      box-sizing:border-box;
    }
    .app{
      max-width:420px;           /* TELEFONO */
      margin:0 auto;
    }
    .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .back{
      display:inline-block;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.55);
      text-decoration:none;
      color:var(--accent);
      font-weight:700;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
    }

    .titleBox{
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.55);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px 22px 16px;
      margin-bottom:18px;
    }
    h1{
      margin:0 0 8px;
      font-family:"Playfair Display",serif;
      font-size:34px;
      line-height:1.08;
      color:var(--accent);
    }
    .sub{ margin:0; color:var(--muted); font-size:14px; }

    .card{
      background:var(--glass);
      border:1px solid rgba(255,255,255,.55);
      border-radius:var(--radius);
      box-shadow:var(--goldGlow);
      padding:18px;
      margin-bottom:16px;
      backdrop-filter: blur(8px);
    }
    .dayHero{
      display:flex;
      gap:14px;
      align-items:center;
      margin-bottom:12px;
    }
    .dayImg{
      width:92px; height:92px;
      border-radius:18px;
      object-fit:cover;
      border:1px solid rgba(231,200,115,.40);
      box-shadow: 0 0 0 6px rgba(255,255,255,.35), 0 14px 36px rgba(0,0,0,.18);
      background:rgba(255,255,255,.35);
    }
    .dayMeta{ flex:1; min-width:0; }
    .tag{
      display:inline-block;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.70);
      border:1px solid rgba(231,200,115,.30);
      color:rgba(15,30,23,.70);
      font-weight:800;
      margin-bottom:8px;
    }
    .card h2{
      margin:0 0 6px;
      font-size:20px;
      color:var(--accent);
      font-weight:900;
      line-height:1.15;
    }
    .card p{ margin:0; color:var(--muted); font-size:15px; line-height:1.45; }

    .mini{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
      color:rgba(15,30,23,.65);
      font-size:13.5px;
    }

    .ctaRow{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      padding:10px 14px;
      border-radius:14px;
      font-weight:900;
      background:rgba(255,255,255,.86);
      color:var(--accent);
      border:1px solid rgba(255,255,255,.55);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .link{ color:var(--accent); font-weight:900; text-decoration:underline; }
    .spacer{ flex:1; }
  </style>
</head>

<body>
  <div class="veil">
    <div class="app">

      <div class="topbar">
        <a class="back" href="index.html">← Home</a>
      </div>

      <div class="titleBox">
        <h1>Wissen &amp; Klarheit</h1>
        <p class="sub">Jeden Tag ein kurzer Impuls – klar, wissenschaftlich fundiert, leicht umsetzbar.</p>
      </div>

      <div class="card">

        <div class="dayHero">
          <img id="dayImg" class="dayImg" src="icons/1.png" alt="Impuls Bild">
          <div class="dayMeta">
            <div class="tag">Tag <span id="dayNum">1</span>/21</div>
            <h2 id="wissenTitle">…</h2>
          </div>
        </div>

        <p id="wissenText">…</p>

        <div class="mini" id="premiumTeaser">
          ✨ Premium: Extra-Insight + Mini-Reflexionsfrage (täglich wechselnd).
        </div>

        <div class="ctaRow">
          <button class="btn" id="prevDayBtn">←</button>
          <button class="btn" id="nextDayBtn">→</button>
          <button class="btn" id="resetCycleBtn">Reset</button>

          <div class="spacer"></div>
          <span style="color:rgba(15,30,23,.65); font-weight:800;">Free-Version ·</span>
          <a class="link" href="mitglieder.html">Mitglieder freischalten</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ====== 21 Tage Wissen & Klarheit (progressione salvata) ======
    const wissen21 = [
      { title: "Tag 1 – Klarer Fokus", text: "Wähle EIN Thema für heute. Notiere den nächsten kleinsten Schritt – und starte." },
      { title: "Tag 2 – Nervensystem beruhigen", text: "Langes Ausatmen aktiviert den Parasympathikus. 6 Atemzüge: 4 ein, 6 aus." },
      { title: "Tag 3 – Gedanken entkoppeln", text: "Gedanken sind Ereignisse – keine Befehle. Sag: „Ich habe den Gedanken, dass…“" },
      { title: "Tag 4 – Struktur statt Druck", text: "Plane nur die nächsten 30 Minuten. Das reicht – und macht dich handlungsfähig." },
      { title: "Tag 5 – Energie durch Haltung", text: "Brustraum öffnen, Schultern weich. Haltung sendet Sicherheit ans Nervensystem." },
      { title: "Tag 6 – Regeneration", text: "10 Minuten draußen (auch langsam). Tageslicht + Bewegung = sanfter Reset." },
      { title: "Tag 7 – Klarheit & Ausrichtung", text: "Was war diese Woche hilfreich? Was lässt du weg? Ein Satz reicht." },

      { title: "Tag 8 – Reiz filtern", text: "Weniger Input = mehr Klarheit. 2× am Tag 10 Minuten ohne Handy." },
      { title: "Tag 9 – Körper als Anker", text: "Spüre 3 Kontaktpunkte (Füße, Hände, Rücken). Das bringt dich ins Jetzt." },
      { title: "Tag 10 – Mini-Pause", text: "60 Sekunden Pause: ausatmen, Schultern sinken lassen, Blick weich." },
      { title: "Tag 11 – Selbstgespräch", text: "Sag dir: „Es ist gerade viel. Ich mache einen kleinen Schritt.“" },
      { title: "Tag 12 – Priorität", text: "Was ist heute wirklich wichtig? Streiche 1 Sache bewusst von der Liste." },
      { title: "Tag 13 – Grenzen", text: "Ein klares „Nein“ ist Nervensystem-Schutz. Formuliere es freundlich und kurz." },
      { title: "Tag 14 – Energiehaushalt", text: "Plane zuerst Erholung, dann Leistung. 1 Regenerationsblock = Pflicht." },
      { title: "Tag 15 – Fokus-Ritual", text: "Startsignal: Wasser trinken + 3 Atemzüge + eine Aufgabe öffnen." },
      { title: "Tag 16 – Gedanken testen", text: "Frage: „Welche Beweise habe ich wirklich?“ – statt automatisch zu glauben." },
      { title: "Tag 17 – Bewegung klein", text: "2 Minuten gehen oder dehnen. Kleine Aktivierung senkt Stresschemie." },
      { title: "Tag 18 – Soziale Sicherheit", text: "Schreibe einer Person: „Kurz Hallo – wie geht’s?“ Verbindung reguliert." },
      { title: "Tag 19 – Schlafschutz", text: "Heute Abend: Bildschirm 30 Min früher aus. Dein Gehirn wird es lieben." },
      { title: "Tag 20 – Dank/Orientierung", text: "Notiere 1 Sache, die funktioniert. Das trainiert den Aufmerksamkeitsfilter." },
      { title: "Tag 21 – Integration", text: "Was nimmst du mit? Lass 1 Gewohnheit als „Mini-Standard“ drin." },
    ];

    const KEY = "panacea_wissen_day"; // 0..20

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
    function getDayIndex(){
      const raw = localStorage.getItem(KEY);
      const n = raw === null ? 0 : parseInt(raw, 10);
      if (Number.isNaN(n)) return 0;
      return clamp(n, 0, wissen21.length - 1);
    }
    function setDayIndex(i){
      const v = clamp(i, 0, wissen21.length - 1);
      localStorage.setItem(KEY, String(v));
      renderDay(v);
    }

    function renderDay(i){
      const item = wissen21[i];

      const titleEl = document.getElementById("wissenTitle");
      const textEl  = document.getElementById("wissenText");
      const dayNum  = document.getElementById("dayNum");
      const dayImg  = document.getElementById("dayImg");

      if (titleEl) titleEl.textContent = item.title;
      if (textEl)  textEl.textContent  = item.text;
      if (dayNum)  dayNum.textContent  = String(i + 1);

      // immagine del giorno: icons/1.png..21.png
      if (dayImg) dayImg.src = `icons/${i + 1}.png`;

      const prevBtn = document.getElementById("prevDayBtn");
      const nextBtn = document.getElementById("nextDayBtn");
      if (prevBtn) prevBtn.disabled = (i === 0);
      if (nextBtn) nextBtn.disabled = (i === wissen21.length - 1);
    }

    // Bind bottoni (sicuro)
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    const resetBtn = document.getElementById("resetCycleBtn");

    if (prevBtn)  prevBtn.addEventListener("click", () => setDayIndex(getDayIndex() - 1));
    if (nextBtn)  nextBtn.addEventListener("click", () => setDayIndex(getDayIndex() + 1));
    if (resetBtn) resetBtn.addEventListener("click", () => setDayIndex(0));

    renderDay(getDayIndex());
  </script>
</body>
</html>
