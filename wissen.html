<!doctype html>
<html lang="de">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#113a2d" />
  <title>Wissen & Klarheit – Panacea</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#0f1e17;
      --muted:rgba(15,30,23,.72);
      --glass:rgba(255,255,255,.68);
      --glass2:rgba(255,255,255,.55);
      --shadow:0 24px 60px rgba(0,0,0,.22);
      --radius:22px;
      --accent:#113a2d;
      --line:rgba(231,200,115,.45);
    }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:url("icons/sfondo.png") center / cover no-repeat fixed;
    }
    .dayImg{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:14px;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 14px 28px rgba(0,0,0,.12);
}
    .veil{
      min-height:100%;
      background: radial-gradient(circle at 30% 5%, rgba(255,255,255,.55), rgba(255,255,255,.0) 60%);
      padding:22px 14px 50px;
      box-sizing:border-box;
    }
    .app{
      max-width:860px;
      margin:0 auto;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .back{
      display:inline-block;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.55);
      text-decoration:none;
      color:var(--accent);
      font-weight:600;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
    }
    .titleBox{
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.55);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:26px 26px 18px;
      margin-bottom:22px;
    }
    h1{
      margin:0 0 10px;
      font-family:"Playfair Display",serif;
      font-size:38px;
      line-height:1.1;
      color:var(--accent);
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }
    .card{
      background:var(--glass);
      border:1px solid rgba(255,255,255,.55);
      border-radius:var(--radius);
      box-shadow:0 18px 40px rgba(0,0,0,.16);
      padding:22px;
      margin-bottom:18px;
      backdrop-filter: blur(8px);
    }
    .card h2{
      margin:0 0 10px;
      font-size:24px;
      color:var(--accent);
      font-weight:800;
    }
    .card p{ margin:0; color:var(--muted); font-size:16px; line-height:1.45; }
    .mini{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
      color:rgba(15,30,23,.65);
      font-size:14px;
    }
    .ctaRow{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      padding:10px 14px;
      border-radius:14px;
      font-weight:800;
      background:rgba(255,255,255,.85);
      color:var(--accent);
      border:1px solid rgba(255,255,255,.55);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
    }
    .link{
      color:var(--accent);
      font-weight:800;
      text-decoration:underline;
    }
    .titleBox { padding: 30px 30px 22px; }
h1 { font-size: 42px; }

.card { padding: 28px; }
.card h2 { font-size: 30px; }
.card p { font-size: 18px; }

.btn{
  padding: 12px 18px;
  font-size: 16px;
  border-radius: 16px;
}

.mini{ font-size: 15px; }
    <img id="wissenImg" class="dayImg" src="icons/wissen/01.jpg" alt="">
  </style>
</head>

<body>
  <div class="veil">
    <div class="app">

      <div class="topbar">
        <a class="back" href="index.html">← Home</a>
      </div>

      <div class="titleBox">
        <h1>Wissen &amp; Klarheit</h1>
        <p class="sub">Jeden Tag ein kurzer Impuls – klar, wissenschaftlich fundiert, leicht umsetzbar.</p>
      </div>

      <div class="card">
        <h2 id="wissenTitle"></h2>
        <p id="wissenText"></p>

        <div class="mini" id="premiumTeaser">
          ✨ Premium: Extra-Insight + Mini-Reflexionsfrage (täglich wechselnd).
        </div>
<img id="wissenImg" alt="Tagesbild" style="width:100%; max-height:260px; object-fit:cover; border-radius:18px; margin-top:14px; border:1px solid rgba(255,255,255,.55); box-shadow:0 12px 30px rgba(0,0,0,.12);" />    
      </div>
      </div>

    </div>
  </div>

  <script>
  <script>
  // ====== 21 Tage Wissen & Klarheit (progressione salvata) ======
  const wissen21 = [
    { title: "Tag 1 – Klarer Fokus", text: "Wähle EIN Thema für heute. Notiere den nächsten kleinsten Schritt – und starte." },
    { title: "Tag 2 – Nervensystem beruhigen", text: "Langes Ausatmen aktiviert den Parasympathikus. 6 Atemzüge: 4 ein, 6 aus." },
    { title: "Tag 3 – Gedanken entkoppeln", text: "Gedanken sind Ereignisse – keine Befehle. Sag: „Ich habe den Gedanken, dass…“" },
    { title: "Tag 4 – Struktur statt Druck", text: "Plane nur die nächsten 30 Minuten. Das reicht – und macht dich handlungsfähig." },
    { title: "Tag 5 – Energie durch Haltung", text: "Brustraum öffnen, Schultern weich. Haltung sendet Sicherheit ans Nervensystem." },
    { title: "Tag 6 – Regeneration", text: "10 Minuten draußen (auch langsam). Tageslicht + Bewegung = sanfter Reset." },
    { title: "Tag 7 – Klarheit & Ausrichtung", text: "Was war diese Woche hilfreich? Was lässt du weg? Ein Satz reicht." },

    { title: "Tag 8 – …", text: "…" },
    { title: "Tag 9 – …", text: "…" },
    { title: "Tag 10 – …", text: "…" },
    { title: "Tag 11 – …", text: "…" },
    { title: "Tag 12 – …", text: "…" },
    { title: "Tag 13 – …", text: "…" },
    { title: "Tag 14 – …", text: "…" },
    { title: "Tag 15 – …", text: "…" },
    { title: "Tag 16 – …", text: "…" },
    { title: "Tag 17 – …", text: "…" },
    { title: "Tag 18 – …", text: "…" },
    { title: "Tag 19 – …", text: "…" },
    { title: "Tag 20 – …", text: "…" },
    { title: "Tag 21 – …", text: "…" },
  ];

  const KEY = "panacea_wissen_day"; // 0..20

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  function getDayIndex() {
    const raw = localStorage.getItem(KEY);
    const n = raw === null ? 0 : parseInt(raw, 10);
    if (Number.isNaN(n)) return 0;
    return clamp(n, 0, wissen21.length - 1);
  }

  function setDayIndex(i) {
    const v = clamp(i, 0, wissen21.length - 1);
    localStorage.setItem(KEY, String(v));
    renderDay(v);
  }

  function renderDay(i) {
    const item = wissen21[i];

    const t = document.getElementById("wissenTitle");
    const p = document.getElementById("wissenText");
    if (t) t.textContent = item.title;
    if (p) p.textContent = item.text;

    // Tag X/21
    const dayNumEl = document.getElementById("dayNum");
    if (dayNumEl) dayNumEl.textContent = String(i + 1);

    // immagine del giorno (1..21) - SENZA zero davanti
    const img = document.getElementById("wissenImg");
    if (img) {
      img.src = `icons/${i + 1}.png?v=${Date.now()}`;
    }

    // bottoni ai bordi
    const prevBtn = document.getElementById("prevDayBtn");
    const nextBtn = document.getElementById("nextDayBtn");
    if (prevBtn) prevBtn.disabled = (i === 0);
    if (nextBtn) nextBtn.disabled = (i === wissen21.length - 1);
  }

  // collega bottoni (safe)
  const prevBtn = document.getElementById("prevDayBtn");
  const nextBtn = document.getElementById("nextDayBtn");
  const resetBtn = document.getElementById("resetCycleBtn");

  if (prevBtn) prevBtn.addEventListener("click", () => setDayIndex(getDayIndex() - 1));
  if (nextBtn) nextBtn.addEventListener("click", () => setDayIndex(getDayIndex() + 1));
  if (resetBtn) resetBtn.addEventListener("click", () => setDayIndex(0));

  // init
  renderDay(getDayIndex());
</script>
</body>
</html>
