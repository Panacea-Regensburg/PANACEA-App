<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wissen & Klarheit – Panacea</title>

  <style>
    :root{
      --green:#1f4d3a;
      --gold:#c8a96a;
      --card: rgba(255,255,255,0.78);
      --card2: rgba(255,255,255,0.65);
      --shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:#1b1b1b;
      background: url("sfondo.png") center/cover no-repeat fixed;
      min-height:100vh;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 14px;
    }

    .homeBtn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(200,169,106,0.35);
      box-shadow: var(--shadow);
      color: var(--green);
      text-decoration:none;
      font-weight:600;
      backdrop-filter: blur(6px);
    }

    .hero{
      background: var(--card);
      border-radius: 26px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(200,169,106,0.35);
      margin-bottom: 14px;
    }

    h1{
      margin: 0 0 6px 0;
      color: var(--green);
      font-size: 46px;
      letter-spacing: 0.2px;
    }

    .sub{
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      opacity: 0.88;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card{
      background: var(--card2);
      border-radius: 26px;
      padding: 18px 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(200,169,106,0.30);
      backdrop-filter: blur(6px);
    }

    .premium{
      font-size: 18px;
      line-height: 1.4;
    }

    .premium b{ color: var(--green); }
    .premium .star{ color: var(--gold); }

    .dayRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }

    .dayTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(200,169,106,0.35);
      background: rgba(255,255,255,0.6);
      color: var(--green);
      font-weight:700;
    }

    .navBtns{
      display:flex;
      gap:8px;
    }

    .btn{
      cursor:pointer;
      border:none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 800;
      background: rgba(31,77,58,0.12);
      color: var(--green);
      border: 1px solid rgba(31,77,58,0.18);
      transition: transform .06s ease, background .12s ease;
    }
    .btn:active{ transform: scale(0.98); }
    .btn:hover{ background: rgba(31,77,58,0.18); }
    .btn:disabled{ opacity:0.5; cursor:not-allowed; }

    .imgBox{
      display:flex;
      justify-content:center;
      padding: 10px 0 6px;
    }

    .imgBox img{
      width: min(520px, 100%);
      height: auto;
      border-radius: 18px;
      border: 1px solid rgba(200,169,106,0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.4);
      display:block;
    }

    .contentTitle{
      margin: 6px 0 6px;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .contentText{
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      opacity: 0.92;
      white-space: pre-line;
    }

    .hint{
      margin-top:10px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <a class="homeBtn" href="./index.html">← Home</a>
    </div>

    <div class="hero">
      <h1>Wissen &amp; Klarheit</h1>
      <p class="sub">Jeden Tag ein kurzer Impuls – klar, wissenschaftlich fundiert, leicht umsetzbar.</p>
    </div>

    <div class="grid">

      <div class="card premium">
        <div><span class="star">✨</span> <b>Premium:</b> Extra-Insight + Mini-Reflexionsfrage (täglich wechselnd).</div>
      </div>

      <div class="card">
        <div class="dayRow">
          <div class="dayTag">🗓️ Tag <span id="dayNum">1</span>/21</div>
          <div class="navBtns">
            <button class="btn" id="prevBtn" type="button">←</button>
            <button class="btn" id="nextBtn" type="button">→</button>
          </div>
        </div>

        <div class="contentTitle" id="wissenTitle">Heute</div>
        <p class="contentText" id="wissenText">Lade Inhalt…</p>

        <div class="imgBox">
          <img id="wissenImg" src="./icons/1.png" alt="Tagesbild" />
        </div>

        <div class="hint" id="hint"></div>
      </div>
<div class="premiumBox">
  <div class="premiumTitle">✨ Premium</div>
  <p id="premiumInsight"></p>
  <p id="premiumQuestion"></p>
</div>
    </div>
  </div>

  <script>
    // =========================
    // SETTINGS
    // =========================
    const TOTAL_DAYS = 21;
    const LS_KEY = "panacea_wissen_day";

    // Fallback contenuti (se data/wissen.json non esiste o non si carica)
    const fallback = Array.from({ length: TOTAL_DAYS }, (_, i) => ({
      title: `Impuls – Tag ${i + 1}`,
      text:
        "1 kleiner Gedanke für heute:\n" +
        "• Atme einmal bewusst aus.\n" +
        "• Frage dich: Was brauche ich JETZT – 1% leichter?\n" +
        "• Wähle eine Mini-Handlung (30 Sekunden)."
    }));

    // =========================
    // HELPERS
    // =========================
    function clampDay(n){
      if (!Number.isFinite(n)) return 1;
      if (n < 1) return 1;
      if (n > TOTAL_DAYS) return TOTAL_DAYS;
      return n;
    }

    function setDay(n){
      const day = clampDay(n);
      localStorage.setItem(LS_KEY, String(day));
      render(day);
    }

    function getDay(){
      const raw = localStorage.getItem(LS_KEY);
      const n = parseInt(raw, 10);
      return clampDay(Number.isFinite(n) ? n : 1);
    }

    function bust(url){
      return url + "?v=" + Date.now();
    }

    // =========================
    // DATA LOAD
    // =========================
    let wissenData = null;

    async function loadWissenJson(){
      try{
        const res = await fetch("./data/wissen.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        // accetta due formati:
        // A) array: [{title,text}, ...]
        // B) oggetto: { days: [{title,text}, ...] }
        const arr = Array.isArray(data) ? data : (Array.isArray(data.days) ? data.days : null);
        if (!arr) throw new Error("Formato JSON non valido");

        wissenData = arr.slice(0, TOTAL_DAYS);
        while (wissenData.length < TOTAL_DAYS) wissenData.push(fallback[wissenData.length]);

        document.getElementById("premiumInsight").textContent = item.premiumInsight || "";
document.getElementById("premiumQuestion").textContent = item.premiumQuestion || "";
    }

    // =========================
    // RENDER
    // =========================
    function render(day){
      const idx = day - 1;
      const item = (wissenData && wissenData[idx]) ? wissenData[idx] : fallback[idx];

      const t = document.getElementById("wissenTitle");
      const p = document.getElementById("wissenText");
      const d = document.getElementById("dayNum");
      const img = document.getElementById("wissenImg");

      d.textContent = String(day);
      t.textContent = item.title || `Impuls – Tag ${day}`;
      p.textContent = item.text || "";

      // ✅ percorso immagini: icons/1.png ... icons/21.png
      img.src = bust(`./icons/${day}.png`);

      document.getElementById("prevBtn").disabled = (day <= 1);
      document.getElementById("nextBtn").disabled = (day >= TOTAL_DAYS);
    }

    // =========================
    // INIT
    // =========================
    (async function init(){
      await loadWissenJson();
      render(getDay());

      document.getElementById("prevBtn").addEventListener("click", () => setDay(getDay() - 1));
      document.getElementById("nextBtn").addEventListener("click", () => setDay(getDay() + 1));
    })();
  </script>
</body>
</html>
