<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f3b2f" />
  <title>Panacea – Body & Mind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --glass: rgba(255,255,255,.82);
      --glass2: rgba(255,255,255,.72);
      --text: #0f1c16;
      --muted: rgba(15,28,22,.72);
      --border: rgba(255,255,255,.55);
      --shadow: 0 16px 44px rgba(0,0,0,.22);
      --radius: 22px;
      --cardRadius: 20px;
      --maxAppWidth: 440px; /* look “app” su desktop */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: url("icons/sfondo.png") center/cover no-repeat fixed;
    }

    .veil{
      min-height: 100%;
      padding: 18px 14px 22px;
      background: radial-gradient(circle at top, rgba(255,255,255,.20), rgba(0,0,0,.25));
      display:flex;
      justify-content:center;
    }

    /* Contenitore “app” (verticale, centrato) */
    .app{
      width: 100%;
      max-width: var(--maxAppWidth);
    }

    header{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0 14px;
    }

    .brand{
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    h1{
      margin:0 0 6px;
      font-size: 26px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .tagline{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .topRow{
      display:flex;
      justify-content:flex-end;
    }

    .lang{
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      box-shadow: 0 10px 26px rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
      font-size: 13px;
      color: rgba(15,28,22,.78);
      display:inline-flex;
      gap:6px;
      align-items:center;
      justify-content:center;
    }
    .lang button{
      border:0;
      background: transparent;
      font: inherit;
      color: inherit;
      font-weight: 700;
      cursor:pointer;
      padding: 0 2px;
    }
    .lang button:hover{ text-decoration: underline; }

    main{
      padding: 14px;
      border-radius: var(--radius);
      background: rgba(255,255,255,.60);
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Griglia “app”: 2 colonne su mobile */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    /* Card: icona grande */
    .card{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px;
      border-radius: var(--cardRadius);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
      text-decoration:none;
      color: var(--text);
      transition: transform .10s ease, box-shadow .10s ease, background .10s ease;
      min-height: 170px; /* più “tocco” come app */
    }
    .card:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0,0,0,.16);
      background: rgba(255,255,255,.92);
    }
    .card:focus{
      outline: 3px solid rgba(255, 215, 120, .85);
      outline-offset: 3px;
    }

    .icon{
  width: 90%;
  max-width: 150px;
  height: auto;
  object-fit: contain;
  display:block;
  margin:auto;
  filter: drop-shadow(0 14px 20px rgba(0,0,0,.18));
}

    /* Su desktop grande, restiamo “app-like” */
    @media (min-width: 900px){
      .veil{ padding-top: 26px; }
    }

    footer{
      margin-top: 12px;
      text-align:center;
      color: rgba(255,255,255,.86);
      font-size: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
  </style>
</head>

<body>
  <div class="veil">
    <div class="app">

      <div class="topRow">
        <div class="lang" aria-label="Sprache wählen">
          <button type="button" onclick="setLang('de')">Deutsch</button>
          <span>|</span>
          <button type="button" onclick="setLang('it')">Italiano</button>
        </div>
      </div>

      <header>
        <div class="brand">
          <h1 id="title">Panacea – Body &amp; Mind</h1>
          <p class="tagline" id="tagline">Kleine Schritte. Mehr Stabilität. Jeden Tag.</p>
        </div>
      </header>

      <main>
        <div class="grid">
          <a class="card" href="daily-reset.html" aria-label="Daily Reset">
            <img class="icon" src="icons/daily-reset.png" alt="Daily Reset">
          </a>

          <a class="card" href="wissen-klarheit.html" aria-label="Wissen & Klarheit">
            <img class="icon" src="icons/wissen-klarheit.png" alt="Wissen & Klarheit">
          </a>

          <a class="card" href="lifestyle.html" aria-label="Lifestyle">
            <img class="icon" src="icons/lifestyle.png" alt="Lifestyle">
          </a>

          <a class="card" href="uebungen.html" aria-label="Übungen">
            <img class="icon" src="icons/uebungen.png" alt="Übungen">
          </a>

          <a class="card" href="kurse.html" aria-label="Kurse">
            <img class="icon" src="icons/kurse.png" alt="Kurse">
          </a>

          <a class="card" href="mitgliederbereich.html" aria-label="Mitgliederbereich">
            <img class="icon" src="icons/mitgliederbereich.png" alt="Mitgliederbereich">
          </a>
        </div>
      </main>

      <footer>© Panacea Regensburg</footer>

    </div>
  </div>

  <script>
    // lingua semplice (solo testo header per ora)
    const t = {
      de: {
        tagline: "Kleine Schritte. Mehr Stabilität. Jeden Tag."
      },
      it: {
        tagline: "Piccoli passi. Più stabilità. Ogni giorno."
      }
    };

    function setLang(lang){
      localStorage.setItem("panacea_lang", lang);
      document.getElementById("tagline").textContent = t[lang]?.tagline || t.de.tagline;
    }

    // init
    setLang(localStorage.getItem("panacea_lang") || "de");
  </script>
</body>
</html>
