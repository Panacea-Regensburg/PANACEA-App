<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#113a2d" />
  <title>Panacea – Body & Mind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#113a2d;
      --text:#0f1e17;
      --muted:rgba(15,30,23,.72);
      --glass:rgba(255,255,255,.78);
      --radius:26px;
      --shadow:0 24px 60px rgba(0,0,0,.22);
      --gold: rgba(231,200,115,.75);
    }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:url("icons/sfondo.png") center / cover no-repeat fixed;
    }
    .veil{
      min-height:100%;
      background: radial-gradient(circle at 30% 5%, rgba(255,255,255,.55), rgba(255,255,255,.0) 62%);
      padding:22px 14px 54px;
      box-sizing:border-box;
    }
    .app{
      max-width:420px; /* TELEFONO */
      margin:0 auto;
    }

    .headerRow{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:14px;
    }
    .titleBox{
      flex:1;
      background:rgba(255,255,255,.80);
      border:1px solid rgba(255,255,255,.55);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px 22px 16px;
      position:relative;
      overflow:hidden;
    }
    .titleBox:before{
      content:"";
      position:absolute; inset:-60px -80px auto auto;
      width:240px; height:240px;
      background: radial-gradient(circle, rgba(231,200,115,.35), rgba(231,200,115,0) 62%);
      filter: blur(2px);
      pointer-events:none;
    }

    .brand{
      margin:0;
      font-family:"Playfair Display",serif;
      font-weight:700;
      color:var(--accent);
      line-height:1.02;
    }
    .brand .panacea{ font-size:44px; display:block; }
    .brand .bodymind{ font-size:38px; display:block; }
    .hero-title {
  width: 100%;
  max-width: 480px;   /* stessa larghezza delle card */
  margin: 0 auto 30px auto;
  padding: 0 20px;
}
.hero-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  line-height: 1.15;
  white-space: nowrap;   /* non andare a capo */
}
.panacea {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  color: #1e3a2f;
  letter-spacing: 1px;
}

.bodymind {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: #1e3a2f;
  text-shadow: 0 0 8px rgba(212,175,55,0.4);
}

.subtitle {
  font-size: 16px;
  margin-top: 12px;
  white-space: nowrap;   /* anche lui non va a capo */
}

    .tagline{
      margin:12px 0 0;
      color:rgba(15,30,23,.78);
      font-weight:600;
      font-size:14.5px;
    }

    /* ===== Language switch: smaller + left inside app ===== */
.lang-switch {
  position: relative;
  width: 100%;
  max-width: 480px;     /* uguale al blocco app */
  margin: 0 auto;
  padding: 0 20px;
}

.lang-switch .pill {
  display: inline-flex;
  gap: 10px;
  padding: 6px 8px;     /* più piccolo */
  border-radius: 999px;
  background: rgba(255,255,255,0.72);
  box-shadow: 0 10px 28px rgba(0,0,0,0.08);
  border: 1px solid rgba(212,175,55,0.25);
  align-items: center;

  /* più a sinistra */
  justify-content: flex-start;
}

.lang-switch button {
  font-size: 14px;      /* più piccolo */
  padding: 8px 12px;    /* più piccolo */
  border-radius: 999px;
  border: none;
  background: transparent;
  cursor: pointer;
}

.lang-switch button.active {
  background: rgba(212,175,55,0.25);
  border: 1px solid rgba(212,175,55,0.35);
}
    .pill{
      border:0;
      cursor:pointer;
      padding:8px 12px;
      border-radius:999px;
      font-weight:800;
      background:transparent;
      color:var(--accent);
    }
    .pill.active{
      background: linear-gradient(135deg, rgba(231,200,115,.92), rgba(231,200,115,.60));
      box-shadow: 0 0 18px rgba(231,200,115,.28);
    }

    .gridWrap{
      background:rgba(255,255,255,.24);
      border:1px solid rgba(255,255,255,.30);
      border-radius:32px;
      padding:18px;
      box-shadow: 0 26px 70px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }

    .card{
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:24px;
      background:rgba(255,255,255,.86);
      border:1px solid rgba(255,255,255,.55);
      box-shadow: 0 0 0 1px rgba(231,200,115,.14), 0 18px 44px rgba(0,0,0,.16);
      text-decoration:none;
      padding:12px;
      min-height:140px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:auto -40px -60px auto;
      width:180px; height:180px;
      background: radial-gradient(circle, rgba(231,200,115,.20), rgba(231,200,115,0) 65%);
      pointer-events:none;
    }
    .card img{
      width:86%;
      height:auto;
      display:block;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.10));
    }
/* ===== Icon buttons: image fills ~85% of the square ===== */
.tile {
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile img {
  width: 75%;
  height: 75%;
  object-fit: contain;
  display: block;
}
    .footer{
      text-align:center;
      margin-top:16px;
      color:rgba(255,255,255,.70);
      font-weight:700;
      text-shadow:0 2px 10px rgba(0,0,0,.28);
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="veil">
    <div class="app">

      <div class="headerRow">
       <div class="hero-title">
  <h1>
    <span class="panacea">Panacea</span><br>
    <span class="bodymind">Body & Mind</span>
  </h1>
  <p class="subtitle">Kleine Schritte. Mehr Stabilität. Jeden Tag.</p>
</div>

        <div class="lang-switch">
  <div class="pill">
    <button class="active">Deutsch</button>
    <button>Italiano</button>
  </div>
</div>

      <div class="gridWrap">
        <div class="grid">

          <a class="card" href="daily-reset.html" aria-label="Daily Reset">
            <img src="icons/daily-reset.png" alt="Daily Reset">
          </a>

          <a class="card" href="wissen.html" aria-label="Wissen & Klarheit">
            <img src="icons/wissen-klarheit.png" alt="Wissen & Klarheit">
          </a>

          <a class="card" href="lifestyle.html" aria-label="Life Style">
            <img src="icons/lifestyle.png" alt="Life Style">
          </a>

          <a class="card" href="uebungen.html" aria-label="Übungen">
            <img src="icons/uebungen.png" alt="Übungen">
          </a>

          <a class="card" href="kurse.html" aria-label="Kurse">
            <img src="icons/kurse.png" alt="Kurse">
          </a>

          <a class="card" href="mitglieder.html" aria-label="Mitgliederbereich">
            <img src="icons/mitgliederbereich.png" alt="Mitgliederbereich">
          </a>

        </div>
      </div>

      <div class="footer">© Panacea Regensburg</div>

    </div>
  </div>
</body>
</html>
