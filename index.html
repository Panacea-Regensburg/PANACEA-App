<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#113a2d" />
<title>Panacea – Body & Mind</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#113a2d;
  --text:#0f1e17;
  --muted:rgba(15,30,23,.7);
  --glass:rgba(255,255,255,.75);
  --radius:22px;
  --shadow:0 24px 60px rgba(0,0,0,.22);
}

html, body { height:100%; }

body{
  margin:0;
  font-family:"Plus Jakarta Sans", system-ui, sans-serif;
  background:url("icons/sfondo.png") center / cover no-repeat fixed;
  color:var(--text);
}

.veil{
  min-height:100%;
  padding:40px 18px 60px;
  background:radial-gradient(circle at 30% 5%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%);
}

.app{
  max-width:920px;
  margin:0 auto;
}

/* ===== BRAND TITLE ===== */

.brand-title{
  margin:0 0 18px;
  font-family:"Playfair Display", serif;
  font-size:56px;
  line-height:1.05;
  color:var(--accent);
  letter-spacing:0.5px;
  position:relative;
}

.brand-title::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:120px;
  height:3px;
  background:linear-gradient(90deg,#c6a545,#f3dc9b,#c6a545);
  border-radius:4px;
  box-shadow:
    0 0 8px rgba(198,165,69,0.6),
    0 0 16px rgba(198,165,69,0.35);
}

.brand-sub{
  display:block;
  font-size:30px;
  font-weight:500;
  margin-top:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#c6a545,#f3dc9b,#c6a545);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 8px rgba(198,165,69,0.4),
    0 0 18px rgba(198,165,69,0.25);
}

.subtitle{
  margin-top:18px;
  font-size:18px;
  color:var(--muted);
}

/* ===== CARDS GRID ===== */

.grid{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:26px;
}

.card{
  background:var(--glass);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:40px 20px;
  text-align:center;
  transition:.3s ease;
  text-decoration:none;
  color:var(--accent);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 30px 70px rgba(0,0,0,.25);
}

.card img{
  width:140px;
  height:auto;
  margin-bottom:14px;
}

.footer{
  text-align:center;
  margin-top:60px;
  font-size:14px;
  color:rgba(0,0,0,.5);
}
</style>
</head>

<body>
<div class="veil">
<div class="app">

<h1 class="brand-title">
  Panacea<br>
  <span class="brand-sub">Body &amp; Mind</span>
</h1>

<p class="subtitle">
  Kleine Schritte. Mehr Stabilität. Jeden Tag.
</p>

<div class="grid">

<a href="daily-reset.html" class="card">
  <img src="icons/daily.png" alt="">
  <div>Daily Reset</div>
</a>

<a href="wissen.html" class="card">
  <img src="icons/wissen.png" alt="">
  <div>Wissen & Klarheit</div>
</a>

<a href="lifestyle.html" class="card">
  <img src="icons/lifestyle.png" alt="">
  <div>Life Style</div>
</a>

<a href="uebungen.html" class="card">
  <img src="icons/uebungen.png" alt="">
  <div>Übungen</div>
</a>

<a href="kurse.html" class="card">
  <img src="icons/kurse.png" alt="">
  <div>Kurse</div>
</a>

<a href="mitglieder.html" class="card">
  <img src="icons/mitglieder.png" alt="">
  <div>Mitgliederbereich</div>
</a>

</div>

<div class="footer">
© Panacea Regensburg
</div>

</div>
</div>
</body>
</html>
