<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panacea – Body & Mind</title>

  <!-- Font luxury -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --app-max: 480px;
      --green: #1f3b2f;
      --text: #21322b;
      --muted: #4b5d53;
      --gold: rgba(212,175,55,0.55);
      --gold-soft: rgba(212,175,55,0.28);
      --card: rgba(255,255,255,0.72);
      --card-2: rgba(255,255,255,0.62);
      --shadow: 0 14px 38px rgba(0,0,0,0.10);
      --shadow-soft: 0 10px 28px rgba(0,0,0,0.08);
      --radius: 26px;
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      /* SFONDO: se vuoi usare un'immagine tua, sostituisci qui sotto */
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(255,220,170,0.35), transparent 55%),
        radial-gradient(1200px 800px at 30% 70%, rgba(200,255,230,0.25), transparent 55%),
        linear-gradient(180deg, #f4efe7 0%, #efe9df 60%, #ede6dc 100%);
      min-height: 100vh;

      display: flex;
      justify-content: center;
    }

    /* ====== APP SHELL (telefono) ====== */
    .app-shell{
      width: 100%;
      max-width: var(--app-max);
      padding: 22px 18px 34px;
      position: relative;
    }

    /* (Anti “colonne strane”) se nel tuo vecchio CSS esisteva un frame laterale, qui lo neutralizziamo */
    .phone-frame, .side-frame, .mockup, .device-frame, .right-panel, .phone-outline{
      display: none !important;
    }

    /* ====== Header row (language switch) ====== */
    .top-row{
      width: 100%;
      display: flex;
      justify-content: flex-start; /* più a sinistra */
      align-items: center;
      margin-bottom: 18px;
    }

    .lang-pill{
      display: inline-flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid rgba(212,175,55,0.25);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .lang-pill button{
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      color: #2b3a33;
      font-weight: 600;
    }
    .lang-pill button.active{
      background: rgba(212,175,55,0.25);
      border: 1px solid rgba(212,175,55,0.30);
    }

    /* ====== Hero title ====== */
    .hero-card{
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 20px 18px;
      margin-bottom: 18px;
    }

    .hero-title{
      width: 100%;
    }

    .hero-title h1{
      margin: 0;
      font-family: "Playfair Display", serif;
      color: var(--green);
      letter-spacing: 0.6px;
      line-height: 1.15;
      font-size: 40px; /* elegante, non enorme */
      text-shadow: 0 0 10px rgba(212,175,55,0.18);
    }

    /* Non andare a capo (come richiesto) */
    .hero-title .line-2{
      white-space: nowrap;
      font-size: 32px;
      display: inline-block;
    }

    .subtitle{
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap; /* non andare a capo */
    }

    /* ====== Menu grid ====== */
    .menu-card{
      width: 100%;
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 18px;
    }

    .grid{
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tile{
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(212,175,55,0.18);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .tile:hover{
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(0,0,0,0.10);
    }

    /* immagini riempiono il 85% del quadrato */
    .tile img{
      width: 85%;
      height: 85%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.10));
    }

    /* mini footer */
    .footer{
      margin-top: 14px;
      text-align: right;
      font-size: 12px;
      color: rgba(33,50,43,0.55);
      font-weight: 600;
    }

    /* Responsive: se lo schermo è super stretto, lasciamo comunque respirare senza uscire */
    @media (max-width: 360px){
      .hero-title h1{ font-size: 36px; }
      .hero-title .line-2{ font-size: 28px; }
      .subtitle{ font-size: 14px; white-space: normal; } /* solo per schermi minuscoli */
    }
  </style>
</head>

<body>
  <main class="app-shell">

    <!-- Language switch (small, left, inside app) -->
    <div class="top-row">
      <div class="lang-pill" aria-label="Language">
        <button id="btnDE" class="active" type="button">Deutsch</button>
        <button id="btnIT" type="button">Italiano</button>
      </div>
    </div>

    <!-- Hero -->
    <section class="hero-card">
      <div class="hero-title">
        <h1>
          <span id="tPanacea">Panacea</span><br>
          <span class="line-2" id="tBodyMind">Body &amp; Mind</span>
        </h1>
        <p class="subtitle" id="tSub">Kleine Schritte. Mehr Stabilität. Jeden Tag.</p>
      </div>
    </section>

    <!-- Menu tiles -->
    <section class="menu-card">
      <div class="grid">

      <img src="icons/daily-reset.png" alt="Daily Reset">
<img src="icons/wissen-klarheit.png" alt="Wissen & Klarheit">
<img src="icons/lifestyle.png" alt="Life Style">
<img src="icons/uebungen.png" alt="Übungen">
<img src="icons/kurse.png" alt="Kurse">
<img src="icons/mitgliederbereich.png" alt="Mitgliederbereich">
      </div>

      <div class="footer">© Panacea Regensburg</div>
    </section>

  </main>

  <script>
    // ===== Language handling (DE/IT) =====
    const btnDE = document.getElementById("btnDE");
    const btnIT = document.getElementById("btnIT");

    const tPanacea = document.getElementById("tPanacea");
    const tBodyMind = document.getElementById("tBodyMind");
    const tSub = document.getElementById("tSub");

    const TEXT = {
      de: {
        panacea: "Panacea",
        bodymind: "Body & Mind",
        sub: "Kleine Schritte. Mehr Stabilität. Jeden Tag."
      },
      it: {
        panacea: "Panacea",
        bodymind: "Body & Mind",
        sub: "Piccoli passi. Più stabilità. Ogni giorno."
      }
    };

    function setLang(lang){
      localStorage.setItem("panacea_lang", lang);
      btnDE.classList.toggle("active", lang === "de");
      btnIT.classList.toggle("active", lang === "it");

      tPanacea.textContent = TEXT[lang].panacea;
      tBodyMind.textContent = TEXT[lang].bodymind;
      tSub.textContent = TEXT[lang].sub;

      document.documentElement.lang = lang;
    }

    btnDE.addEventListener("click", () => setLang("de"));
    btnIT.addEventListener("click", () => setLang("it"));

    // init
    const saved = localStorage.getItem("panacea_lang") || "de";
    setLang(saved);
  </script>
</body>
</html>
